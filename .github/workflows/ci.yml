name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:


jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid pulling the ~2 GB CUDA wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        # Reads select/ignore from pyproject.toml [tool.ruff.lint] — no CLI overrides
        run: ruff check app/

      - name: Run Pytest Test Suite
        # -m "not requires_model" skips tests that need trained .pt artifact files
        # PYTHONPATH exposes repo root so capture/, worldmodel_v2/, worldmodel_v3/ are importable
        run: pytest tests/ -v -m "not requires_model"
        env:
          PYTHONPATH: ${{ github.workspace }}

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build
