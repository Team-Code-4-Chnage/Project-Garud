name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid pulling the ~2 GB CUDA wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        # Reads select/ignore from pyproject.toml [tool.ruff.lint] — no CLI overrides
        run: ruff check app/

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v -m "not requires_model" \
            --tb=short --junitxml=test-results.xml
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}

      - name: Run Model Quality Tests
        # Allowed to fail in CI: model .pt files are large and live in artifacts/
        # which is tracked in git but not uploaded to GitHub Actions cache.
        run: |
          pytest tests/ -v -m "requires_model" --tb=short || \
            echo "::warning::Model quality tests skipped — .pt artifacts not available in CI runner"
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build

  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off || true

      - name: npm audit
        run: |
          cd frontend && npm audit --omit=dev || true

