[project]
name = "project-garud"
version = "1.0.0"
description = "Project Garud — Autonomous Network Attack Forecasting & Deep World Model Telemetry Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "torch>=2.0.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "shap>=0.43.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.19.0",
  "python-multipart>=0.0.6",
  "pydantic>=2.0.0",
  "websockets>=12.0",
  "matplotlib>=3.7.0",
  "tqdm>=4.65.0",
  "httpx>=0.25.0",
  "requests>=2.28.0",
  "scapy>=2.5.0",
  "slowapi>=0.1.9",
  "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0"
]


[tool.pytest.ini_options]
# Expose repo root so `capture`, `worldmodel_v2`, `worldmodel_v3` are importable
# both locally (cwd=backend) and in CI (working-directory: backend)
pythonpath = ["..", "."]
testpaths = ["tests"]
markers = [
  "requires_model: marks tests that need trained .pt artifacts (skipped in CI)",
]

[tool.pyrefly]
python-interpreter-path = "backend/venv/Scripts/python.exe"
search_path = [
  ".",
  "backend",
  "capture",
  "backend/venv/Lib/site-packages"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app", "capture"]
